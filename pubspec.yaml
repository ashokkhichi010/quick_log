name: quick_log
description: "Quick Log: a low-friction Flutter app for daily work logging and productivity tracking."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^21.0.0
  flutter_riverpod: 2.6.1
  flutter_timezone: ^5.0.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  share_plus: ^12.0.2
  speech_to_text: ^7.3.0
  timezone: ^0.11.0
  uuid: ^4.5.3
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

flutter_launcher_icons:
  android: true
  image_path: "assets/icons/icon.png"
  # For Android 8.0+ adaptive icons (Optional)
  # adaptive_icon_background: "#ffffff" # or image path
  # adaptive_icon_foreground: "assets/icon/icon_foreground.png"
